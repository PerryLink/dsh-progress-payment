<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-label="dsh-progress-payment workflow">
  <rect width="960" height="220" fill="#0d1117"/>
  <g font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#e6edf3">
    <rect x="30" y="62" width="210" height="96" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="48" y="94" font-size="16" font-weight="600">本期申报 CSV</text>
    <text x="48" y="120" fill="#8b949e" font-size="13">7 列 · 6 个清单项</text>
    <text x="48" y="140" fill="#8b949e" font-size="13">合成数据</text>

    <rect x="300" y="62" width="210" height="96" rx="12" fill="#161b22" stroke="#58a6ff"/>
    <text x="318" y="94" font-size="16" font-weight="600">progress.ingest</text>
    <text x="318" y="120" fill="#8b949e" font-size="13">解析 · 校验表头</text>
    <text x="318" y="140" fill="#8b949e" font-size="13">batch_id（会话内存）</text>

    <rect x="570" y="62" width="210" height="96" rx="12" fill="#161b22" stroke="#f0b429"/>
    <text x="588" y="94" font-size="16" font-weight="600">progress.audit</text>
    <text x="588" y="120" fill="#8b949e" font-size="13">整数分金额 · 累计比例</text>
    <text x="588" y="140" fill="#8b949e" font-size="13">超量 / 单价 / 重复项</text>

    <rect x="840" y="62" width="90" height="96" rx="12" fill="#161b22" stroke="#3fb950"/>
    <text x="856" y="94" font-size="16" font-weight="600">底稿</text>
    <text x="856" y="120" fill="#8b949e" font-size="13">CSV</text>
    <text x="856" y="140" fill="#8b949e" font-size="13">exports/</text>

    <g stroke="#8b949e" stroke-width="2" fill="none">
      <path d="M240 110h52" marker-end="url(#a)"/>
      <path d="M510 110h52" marker-end="url(#a)"/>
      <path d="M780 110h52" marker-end="url(#a)"/>
    </g>
    <text x="300" y="42" fill="#8b949e" font-size="13">合同基准 CSV（可选）→ 以基准为准</text>
    <text x="570" y="42" fill="#8b949e" font-size="13">金额整数分 · 本地运行 · 不联网</text>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>

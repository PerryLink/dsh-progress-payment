<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-label="dsh-progress-payment: a declaration CSV plus an optional contract baseline CSV go through progress_ingest into one batch; progress_audit checks every item on three axes (over quantity, price difference, duplicate code), computes period amounts and cumulative ratios in integer cents, and the summary reports needs_review; progress_export writes an 8-row UTF-8 BOM worksheet into DSH_HOME exports">
